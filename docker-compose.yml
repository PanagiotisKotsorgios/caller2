services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: "Sales Team CRM"
      APP_TIMEZONE: "Europe/Athens"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_NAME: "crm"
      DB_USER: "crm"
      DB_PASSWORD: "${SERVICE_PASSWORD_64_MYSQL}"
      # Coolify magic variable: requests/generates a public URL routed to port 80
      SERVICE_URL_APP_80: "/"
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "crm"
      MYSQL_USER: "crm"
      MYSQL_PASSWORD: "${SERVICE_PASSWORD_64_MYSQL}"
      MYSQL_ROOT_PASSWORD: "${SERVICE_PASSWORD_64_MYSQLROOT}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
